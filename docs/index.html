            <script>function neighbourhoodHighlight(params) {
  // console.log("in nieghbourhoodhighlight");
  allNodes = nodes.get({ returnType: "Object" });
  // originalNodes = JSON.parse(JSON.stringify(allNodes));
  // if something is selected:
  if (params.nodes.length > 0) {
    highlightActive = true;
    var i, j;
    var selectedNode = params.nodes[0];
    var degrees = 2;

    // mark all nodes as hard to read.
    for (let nodeId in allNodes) {
      // nodeColors[nodeId] = allNodes[nodeId].color;
      allNodes[nodeId].color = "rgba(200,200,200,0.5)";
      if (allNodes[nodeId].hiddenLabel === undefined) {
        allNodes[nodeId].hiddenLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }
    var connectedNodes = network.getConnectedNodes(selectedNode);
    var allConnectedNodes = [];

    // get the second degree nodes
    for (i = 1; i < degrees; i++) {
      for (j = 0; j < connectedNodes.length; j++) {
        allConnectedNodes = allConnectedNodes.concat(
          network.getConnectedNodes(connectedNodes[j])
        );
      }
    }

    // all second degree nodes get a different color and their label back
    for (i = 0; i < allConnectedNodes.length; i++) {
      // allNodes[allConnectedNodes[i]].color = "pink";
      allNodes[allConnectedNodes[i]].color = "rgba(150,150,150,0.75)";
      if (allNodes[allConnectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[allConnectedNodes[i]].label =
          allNodes[allConnectedNodes[i]].hiddenLabel;
        allNodes[allConnectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // all first degree nodes get their own color and their label back
    for (i = 0; i < connectedNodes.length; i++) {
      // allNodes[connectedNodes[i]].color = undefined;
      allNodes[connectedNodes[i]].color = nodeColors[connectedNodes[i]];
      if (allNodes[connectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[connectedNodes[i]].label =
          allNodes[connectedNodes[i]].hiddenLabel;
        allNodes[connectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // the main node gets its own color and its label back.
    // allNodes[selectedNode].color = undefined;
    allNodes[selectedNode].color = nodeColors[selectedNode];
    if (allNodes[selectedNode].hiddenLabel !== undefined) {
      allNodes[selectedNode].label = allNodes[selectedNode].hiddenLabel;
      allNodes[selectedNode].hiddenLabel = undefined;
    }
  } else if (highlightActive === true) {
    // console.log("highlightActive was true");
    // reset all nodes
    for (let nodeId in allNodes) {
      // allNodes[nodeId].color = "purple";
      allNodes[nodeId].color = nodeColors[nodeId];
      // delete allNodes[nodeId].color;
      if (allNodes[nodeId].hiddenLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].hiddenLabel;
        allNodes[nodeId].hiddenLabel = undefined;
      }
    }
    highlightActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    // console.log("Nothing was selected");
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        // allNodes[nodeId].color = {};
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function filterHighlight(params) {
  allNodes = nodes.get({ returnType: "Object" });
  // if something is selected:
  if (params.nodes.length > 0) {
    filterActive = true;
    let selectedNodes = params.nodes;

    // hiding all nodes and saving the label
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = true;
      if (allNodes[nodeId].savedLabel === undefined) {
        allNodes[nodeId].savedLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }

    for (let i=0; i < selectedNodes.length; i++) {
      allNodes[selectedNodes[i]].hidden = false;
      if (allNodes[selectedNodes[i]].savedLabel !== undefined) {
        allNodes[selectedNodes[i]].label = allNodes[selectedNodes[i]].savedLabel;
        allNodes[selectedNodes[i]].savedLabel = undefined;
      }
    }

  } else if (filterActive === true) {
    // reset all nodes
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = false;
      if (allNodes[nodeId].savedLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].savedLabel;
        allNodes[nodeId].savedLabel = undefined;
      }
    }
    filterActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function selectNode(nodes) {
  network.selectNodes(nodes);
  neighbourhoodHighlight({ nodes: nodes });
  return nodes;
}

function selectNodes(nodes) {
  network.selectNodes(nodes);
  filterHighlight({nodes: nodes});
  return nodes;
}

function highlightFilter(filter) {
  let selectedNodes = []
  let selectedProp = filter['property']
  if (filter['item'] === 'node') {
    let allNodes = nodes.get({ returnType: "Object" });
    for (let nodeId in allNodes) {
      if (allNodes[nodeId][selectedProp] && filter['value'].includes((allNodes[nodeId][selectedProp]).toString())) {
        selectedNodes.push(nodeId)
      }
    }
  }
  else if (filter['item'] === 'edge'){
    let allEdges = edges.get({returnType: 'object'});
    // check if the selected property exists for selected edge and select the nodes connected to the edge
    for (let edge in allEdges) {
      if (allEdges[edge][selectedProp] && filter['value'].includes((allEdges[edge][selectedProp]).toString())) {
        selectedNodes.push(allEdges[edge]['from'])
        selectedNodes.push(allEdges[edge]['to'])
      }
    }
  }
  selectNodes(selectedNodes)
}</script>

3cbr\u003eMuscular, soot-streaked arms, hair pulled into a practical bun; always carrying a toolkit and a whetstone.\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePersonality:\u003c/b\u003e\u003cbr\u003ePrecise, disciplined, quietly confident; speaks little but commands respect with her skill.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eOther Details:\u003c/b\u003e\u003cbr\u003eTravels with Aurethion. Acts an armorer--assists in keeping his gear maintained, as well as making minor adjustments."}, {"color": "#9c27b0", "font": {"color": "white"}, "id": "Arvek (Arvie) Spotsnout-Smith", "label": "Arvek (Arvie) Spotsnout-Smith", "shape": "ellipse", "title": "\u003cb\u003eArvek (Arvie) Spotsnout-Smith\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003eAncestry:\u003c/b\u003e Ratfolk\u003cbr\u003e\u003cb\u003eClass:\u003c/b\u003e Inventor\u003cbr\u003e\u003cb\u003eLocation:\u003c/b\u003e Teleporter Room\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePhysical Description:\u003c/b\u003e\u003cbr\u003eThis small Ratfolk has light brown fur and a white patch around his pink nose. He wears clothing with many pockets stuffed with small tools."}, {"color": "#9c27b0", "font": {"color": "white"}, "id": "Aurethion", "label": "Aurethion", "shape": "ellipse", "title": "\u003cb\u003eAurethion\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003eAncestry:\u003c/b\u003e Silver Dragon\u003cbr\u003e\u003cb\u003eClass:\u003c/b\u003e Champion\u003cbr\u003e\u003cb\u003eLocation:\u003c/b\u003e Current Location Unknown\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePhysical Description:\u003c/b\u003e\u003cbr\u003eTall and imposing, partially draconic with gleaming scales integrated into custom-forged plate armor.\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePersonality:\u003c/b\u003e\u003cbr\u003eHonorable to a fault and protective almost to excess; struggles between draconic pride and knightly humility.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eOther Details:\u003c/b\u003e\u003cbr\u003eServes the god Kasjsharux."}, {"color": "#9c27b0", "font": {"color": "white"}, "id": "Britt Underfoot", "label": "Britt Underfoot", "shape": "ellipse", "title": "\u003cb\u003eBritt Underfoot\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003eAncestry:\u003c/b\u003e Halfling\u003cbr\u003e\u003cb\u003eClass:\u003c/b\u003e Rogue\u003cbr\u003e\u003cb\u003eLocation:\u003c/b\u003e Current Location Unknown\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePhysical Description:\u003c/b\u003e\u003cbr\u003eSmall and nimble, with quick fingers and bright green eyes; wears light leather armor and a utility belt full of tools.\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePersonality:\u003c/b\u003e\u003cbr\u003eCurious, cheerful, and slightly mischievous; always the first to explore a new ruin or tunnel."}, {"color": "#9c27b0", "font": {"color": "white"}, "id": "Fennick Glimmerfoot", "label": "Fennick Glimmerfoot", "shape": "ellipse", "title": "\u003cb\u003eFennick Glimmerfoot\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003eAncestry:\u003c/b\u003e Sprite\u003cbr\u003e\u003cb\u003eClass:\u003c/b\u003e Bard\u003cbr\u003e\u003cb\u003eGroup:\u003c/b\u003e Researchers\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePhysical Description:\u003c/b\u003e\u003cbr\u003eTiny, radiant, greenish hair with floral accents; carries a small flute.\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePersonality:\u003c/b\u003e\u003cbr\u003eCheerful, whimsical, loves playing pranks and keeping the group laughing.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eOther Details:\u003c/b\u003e\u003cbr\u003eTravels with Britt Underfoot. Companion and morale booster; helps make long expeditions fun and engaging."}, {"color": "#9c27b0", "font": {"color": "white"}, "id": "Ganizadi Glyphroot", "label": "Ganizadi Glyphroot", "shape": "ellipse", "title": "\u003cb\u003eGanizadi Glyphroot\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003eAncestry:\u003c/b\u003e Conrasu\u003cbr\u003e\u003cb\u003eClass:\u003c/b\u003e Oracle\u003cbr\u003e\u003cb\u003eLocation:\u003c/b\u003e Orthos\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePhysical Description:\u003c/b\u003e\u003cbr\u003eLuminous pale blue core encased in a dark oak wooden exoskeleton, deeply carved with symbols and glyphs representing language and knowledge. Fragments of paper and ink float subtly around the core.\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePersonality:\u003c/b\u003e\u003cbr\u003eSlightly eccentric and intensely focused on patterns in language and history. Speaks in layered metaphors, enjoys unraveling ancient texts, and delights in sharing philosophical insights."}, {"color": "#9c27b0", "font": {"color": "white"}, "id": "Hilda Stoutbrew", "label": "Hilda Stoutbrew", "shape": "ellipse", "title": "\u003cb\u003eHilda Stoutbrew\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003eAncestry:\u003c/b\u003e Dwarf\u003cbr\u003e\u003cb\u003eClass:\u003c/b\u003e Cleric\u003cbr\u003e\u003cb\u003eGroup:\u003c/b\u003e Base Camp\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePhysical Description:\u003c/b\u003e\u003cbr\u003eYoung, round-cheeked, auburn hair in a short braid; simple tunic with Helkara\u2019s holy symbol pinned on. Always carrying a small flask of ale and a satchel of healing herbs.\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePersonality:\u003c/b\u003e\u003cbr\u003eEager, respectful, and a little clumsy; devoted to learning brewing, healing, and hospitality from Thalra. Loves seeing others smile and is quick to help with chores or small tasks.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eOther Details:\u003c/b\u003e\u003cbr\u003eTravels with Thalra Brewmantle. Acolyte and apprentice cleric; learns rituals, healing techniques, and the holy ways of Helkara directly from Thalra."}, {"color": "#9c27b0", "font": {"color": "white"}, "id": "Lunexa Duskweaver", "label": "Lunexa Duskweaver", "shape": "ellipse", "title": "\u003cb\u003eLunexa Duskweaver\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003eAncestry:\u003c/b\u003e Fetchling\u003cbr\u003e\u003cb\u003eClass:\u003c/b\u003e Oracle\u003cbr\u003e\u003cb\u003eGroup:\u003c/b\u003e Base Camp\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePhysical Description:\u003c/b\u003e\u003cbr\u003eYoung, round-cheeked, auburn hair in a short braid; simple tunic with Helkara\u2019s holy symbol pinned on. Always carrying a small flask of ale and a satchel of healing herbs.\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePersonality:\u003c/b\u003e\u003cbr\u003eEager, respectful, and a little clumsy; devoted to learning brewing, healing, and hospitality from Thalra. Loves seeing others smile and is quick to help with chores or small tasks.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eOther Details:\u003c/b\u003e\u003cbr\u003eTravels with Runeweaver. Acolyte and apprentice cleric; learns rituals, healing techniques, and the holy ways of Helkara directly from Thalra."}, {"color": "#9c27b0", "font": {"color": "white"}, "id": "Lyria Moonthread", "label": "Lyria Moonthread", "shape": "ellipse", "title": "\u003cb\u003eLyria Moonthread\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003eAncestry:\u003c/b\u003e Elf\u003cbr\u003e\u003cb\u003eClass:\u003c/b\u003e Wizard\u003cbr\u003e\u003cb\u003eGroup:\u003c/b\u003e Researchers\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePhysical Description:\u003c/b\u003e\u003cbr\u003eSlender, dark hair tied back, robes slightly too long; carries notebooks, quills, and a small crystal orb.\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePersonality:\u003c/b\u003e\u003cbr\u003eInquisitive, attentive, patient; fascinated by Veylorin\u0027s spells and constantly takes notes.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eOther Details:\u003c/b\u003e\u003cbr\u003eTravels with Veylorin Starweaver. Apprentice; learns arcane theory and assists with spell research."}, {"color": "#9c27b0", "font": {"color": "white"}, "id": "Mira Brightleaf", "label": "Mira Brightleaf", "shape": "ellipse", "title": "\u003cb\u003eMira Brightleaf\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003eAncestry:\u003c/b\u003e Conrasu\u003cbr\u003e\u003cb\u003eClass:\u003c/b\u003e Bard\u003cbr\u003e\u003cb\u003eGroup:\u003c/b\u003e Researchers\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePhysical Description:\u003c/b\u003e\u003cbr\u003eYouthful, luminous purple core encased in a wooden exoskeleton; carries a small lyre and floating sheets of notes.\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePersonality:\u003c/b\u003e\u003cbr\u003eCheerful, encouraging, and talkative; keeps the group engaged during long research sessions.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eOther Details:\u003c/b\u003e\u003cbr\u003eTravels with Ganizadi. Companion and morale booster; prevents Ganizadi from becoming too socially isolated while helping with note-taking."}, {"color": "#9c27b0", "font": {"color": "white"}, "id": "Runeweaver", "label": "Runeweaver", "shape": "ellipse", "title": "\u003cb\u003eRuneweaver\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003eAncestry:\u003c/b\u003e Automaton\u003cbr\u003e\u003cb\u003eClass:\u003c/b\u003e Inventor\u003cbr\u003e\u003cb\u003eLocation:\u003c/b\u003e Current Location Unknown\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePhysical Description:\u003c/b\u003e\u003cbr\u003eTall metallic frame with reinforced plating and tool mounts along the limbs. Integrated stabilizers help maintain balance under heavy loads. Optical sensors glow softly in dim light.\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePersonality:\u003c/b\u003e\u003cbr\u003eStoic, methodical, and extremely precise. Constantly tests innovations under stress to improve performance and is deeply protective of allies in battle.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eOther Details:\u003c/b\u003e\u003cbr\u003eInnovation: Reinforced Exosuit, a personal armor enhancement that deploys stabilizing braces and adaptive shields to improve defense and mobility."}, {"color": "#9c27b0", "font": {"color": "white"}, "id": "Rurik Pebbleleaf", "label": "Rurik Pebbleleaf", "shape": "ellipse", "title": "\u003cb\u003eRurik Pebbleleaf\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003eAncestry:\u003c/b\u003e Ghoran\u003cbr\u003e\u003cb\u003eClass:\u003c/b\u003e Wizard\u003cbr\u003e\u003cb\u003eGroup:\u003c/b\u003e Researchers\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePhysical Description:\u003c/b\u003e\u003cbr\u003ePlant-like, dwarf-height humanoid; leafy hair and a small satchel of scrolls and ink bottles.\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePersonality:\u003c/b\u003e\u003cbr\u003eMethodical and loyal; loves organizing Ganizadi\u0027s research, taking meticulous notes, and cross-referencing texts.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eOther Details:\u003c/b\u003e\u003cbr\u003eTravels with Ganizadi. Junior apprentice; shadows Ganizadi during research, learning analysis and pattern recognition."}, {"color": "#9c27b0", "font": {"color": "white"}, "id": "Sir Greg*", "label": "Sir Greg*", "shape": "ellipse", "title": "\u003cb\u003eSir Greg*\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003eAncestry:\u003c/b\u003e Human?\u003cbr\u003e\u003cb\u003eClass:\u003c/b\u003e Unknown\u003cbr\u003e\u003cb\u003eLocation:\u003c/b\u003e Current Location Unknown\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePhysical Description:\u003c/b\u003e\u003cbr\u003eGleaming, excessively gold-trimmed armor; a flowing crimson cape that billows without wind; perfectly styled hair he fixes mid-fight; and a cosmetically glowing longsword. Maintains a striking heroic pose at all times.\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePersonality:\u003c/b\u003e\u003cbr\u003eSpeaks in grand declarations, interrupts others to monologue, interprets disagreement as villainy, and escalates immediately to violence. Cannot admit defeat, insisting every loss was merely a test.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eOther Details:\u003c/b\u003e\u003cbr\u003e*Champion of Light, Scourge of Darkness, Hero of Destiny"}, {"color": "#9c27b0", "font": {"color": "white"}, "id": "Tahlok Shardframe", "label": "Tahlok Shardframe", "shape": "ellipse", "title": "\u003cb\u003eTahlok Shardframe\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003eAncestry:\u003c/b\u003e Automaton\u003cbr\u003e\u003cb\u003eClass:\u003c/b\u003e Wizard\u003cbr\u003e\u003cb\u003eGroup:\u003c/b\u003e Researchers\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePhysical Description:\u003c/b\u003e\u003cbr\u003eSleek metallic body, small glowing nodes, tool compartments along limbs; optical sensors blink softly.\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePersonality:\u003c/b\u003e\u003cbr\u003eMethodical and precise; logs experimental data carefully and assists Runeweaver with calculations.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eOther Details:\u003c/b\u003e\u003cbr\u003eTravels with Runeweaver. Apprentice and assistant; helps with schematics, diagrams, and small technical tests."}, {"color": "#9c27b0", "font": {"color": "white"}, "id": "Thalra Brewmantle", "label": "Thalra Brewmantle", "shape": "ellipse", "title": "\u003cb\u003eThalra Brewmantle\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003eAncestry:\u003c/b\u003e Dwarf\u003cbr\u003e\u003cb\u003eClass:\u003c/b\u003e Cleric\u003cbr\u003e\u003cb\u003eLocation:\u003c/b\u003e Current Location Unknown\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePhysical Description:\u003c/b\u003e\u003cbr\u003eStocky and strong, with auburn hair braided with golden beads. Wears chainmail and a pendant engraved with Helkara\u0027s holy symbols. Carries a reinforced battle tankard that doubles as a weapon and a small satchel of healing supplies.\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePersonality:\u003c/b\u003e\u003cbr\u003eWarm, nurturing, jovial, and steadfast; protective of her allies and always ready with a healing word or frothy mug of ale to lift spirits."}, {"color": "#9c27b0", "font": {"color": "white"}, "id": "Tink Gearwhistle", "label": "Tink Gearwhistle", "shape": "ellipse", "title": "\u003cb\u003eTink Gearwhistle\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003eAncestry:\u003c/b\u003e Gnome\u003cbr\u003e\u003cb\u003eClass:\u003c/b\u003e Alchemist\u003cbr\u003e\u003cb\u003eGroup:\u003c/b\u003e Base Camp\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePhysical Description:\u003c/b\u003e\u003cbr\u003eSmall, copper hair sticking out of a messy cap; always carrying tiny tools and vials.\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePersonality:\u003c/b\u003e\u003cbr\u003eEager, excitable, curious; constantly experimenting under Britt\u0027s guidance.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eOther Details:\u003c/b\u003e\u003cbr\u003eTravels with Britt Underfoot. Apprentice and assistant; helps Britt prepare tools, maps, and traps."}, {"color": "#9c27b0", "font": {"color": "white"}, "id": "Torren Alderforge", "label": "Torren Alderforge", "shape": "ellipse", "title": "\u003cb\u003eTorren Alderforge\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003eAncestry:\u003c/b\u003e Human\u003cbr\u003e\u003cb\u003eClass:\u003c/b\u003e Psion (3.5)\u003cbr\u003e\u003cb\u003eLocation:\u003c/b\u003e The Crystal Mug\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePhysical Description:\u003c/b\u003e\u003cbr\u003eBroad-shouldered and powerfully built. He is bald, with a full, meticulously maintained beard touched by dignified streaks of gray. Magical tattoos formed from luminous crystal trace across his skin, glowing softly and occasionally shifting patterns.\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePersonality:\u003c/b\u003e\u003cbr\u003eFriendly, outgoing, and effortlessly welcoming, with a talent for making strangers feel like regulars. He genuinely cares for his patrons and readily offers advice, comfort, or a discreet favor. Beneath his warmth lies a practical business owner who understands that generosity has limits and even a timeless tavern must turn a profit.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eOther Details:\u003c/b\u003e\u003cbr\u003eProprietor and bartender of The Crystal Mug, an enigmatic tavern that appears in different places and eras. He remembers countless patrons, cultures, and events, though he carefully avoids revealing knowledge that could disr tooltip.style.boxShadow = '0 4px 12px rgba(0,0,0,0.4)';
document.body.appendChild(tooltip);

function showTooltip(event, htmlContent, x, y) {
  if (!htmlContent) {
    tooltip.style.visibility = 'hidden';
    return;
  }
  tooltip.innerHTML = htmlContent.replace(/\n/g, '<br>');
  tooltip.style.left = (x + 20) + 'px';
  tooltip.style.top  = (y + 20) + 'px';
  tooltip.style.visibility = 'visible';
}

function hideTooltip() {
  tooltip.style.visibility = 'hidden';
}

function setupCustomTooltips() {
  if (!window.network) {
    setTimeout(setupCustomTooltips, 100);
    return;
  }

  console.log('Custom HTML tooltips initialized');

  network.on('hoverNode', function(params) {
    const node = network.body.nodes[params.node];
    if (node?.options?.title) {
      showTooltip(params.event, node.options.title, params.event.pageX, params.event.pageY);
    }
  });

  network.on('blurNode', hideTooltip);

  network.on('hoverEdge', function(params) {
    const edge = network.body.edges[params.edge];
    if (edge?.options?.title) {
      showTooltip(params.event, edge.options.title, params.event.pageX, params.event.pageY);
    }
  });

  network.on('blurEdge', hideTooltip);
}

if (document.readyState === 'complete') {
  setupCustomTooltips();
} else {
  document.addEventListener('DOMContentLoaded', setupCustomTooltips);
}
</script></body>
</html>
